[project]
name = "campaign-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["synth-lib", "numpy>=2.2", "pandas>=2.3", "torch>=2.0"]

[tool.uv.sources]
# rev is substituted by workspace.py with the commit the HOST was installed from, so the agent
# evaluates on the same library the verdict will score with.
synth-lib = { git = "https://github.com/synthdataco/synth-lib", rev = "6117938d00077e29747e17db96f77db541bff456" }

[dependency-groups]
research = [
    "chronos-forecasting>=2.3.2",
    "scikit-learn==1.7.2",
]
