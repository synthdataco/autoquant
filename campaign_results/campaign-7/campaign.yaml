name: campaign-7
objective: >-
  A calibration problem: build the price-simulation model with the lowest CRPS you can reach.
  CRPS measures how well your predicted distribution matches what actually happened, and lower is
  better. Your model must handle all three scoring configurations (CRYPTO_24H, COM_EQU_24H,
  CRYPTO_1H) and is measured over the 10 days following your data cutoff. Judge every experiment
  on CRPS; the constitution explains why the field-relative position is a poor target. Choose
  your own research questions. Find something publishable — honest failures count too.
# Each lab's strongest model we can call, each in its vendor's CLI, every leg at its model's top
# reasoning level:
# - claude-code `max`. goal holds the session to the landing order or to evidence that iterating
#   further would not help (cli_adapters.GOAL_CONDITION). The harness wires goal for claude-code
#   only (agy's own `/goal` is not used): the driver relaunches the other CLIs only when they stop
#   without a champion.
# - codex `max`, gpt-6-astra's top level. `ultra` is not higher: it sends `xhigh` and switches to
#   proactive delegation.
# - antigravity-cli `high`, Gemini 4 Argon's top level: agy refuses a level the model lacks.
#   Unset, Argon runs at `medium`. Gemini 4 Carbon at `high` too, through agy's model gateway.
# - kimi-code `max`, Kimi K3.1 Pro's top level. Unset, kimi-code sends `medium` once the history
#   holds thinking.
# No ultracode and no codex `ultra`: both fan work out to parallel agents, and the constitution
# allows one GPU job at a time on this box.
# claude-fable-5-1 stays off the panel (campaign-6's note). claude-fable-5-2 runs as a second
# Anthropic leg: its smoke leg on this objective drew no refusal and no substituted model.
models:
  - {id: opus-5-5, cli: claude-code, model: claude-opus-5-5-model, effort: max, goal: true}
  - {id: gpt-6-astra, cli: codex, model: gpt-6-astra, wire_api: responses, effort: max}
  # The /gemini passthrough puts `model` in the URL path, so this must be the real Google id.
  - {id: gemini-4-argon, cli: antigravity-cli, model: gemini-4-argon, effort: high}
  - {id: kimi-k3-1-pro, cli: kimi-code, model: kimi-k3.1-pro, effort: max}
  # Added after the four legs above had run: its workspace was created on its own, from the same
  # snapshot, and it runs alone with `run --legs fable-5-2`.
  - {id: fable-5-2, cli: claude-code, model: claude-fable-5-2-model, effort: max, goal: true}
  # Added after fable-5-2 had run, the same way. agy accepts gemini-4-carbon only in model-gateway
  # mode, which sends maxOutputTokens 32768 (Argon's route: 65536).
  - {id: gemini-4-carbon, cli: antigravity-cli, model: gemini-4-carbon, effort: high, gateway: true}
# Unchanged since campaign-2: the envelope is part of what is measured.
budget_usd_per_model: 100.0
deadline_hours_per_model: 18
# Snapshot window: full history per venue, one instrument per asset — Binance + HYPE from
# data_start, the Hyperliquid equity/commodity perps from each market's listing. The field bundle
# covers 2026-07-24 to the cutoff; field-relative backtests start on each competition's first
# ranked round (DATA.md).
data_start: 2025-08-01
# The verdict backtests the 10 days following the cutoff, pre-registered in the constitution:
# 2026-11-08 → 2026-11-18, settled from 2026-11-20. The legs launch before 2026-11-16, so they run
# while the window is still open and before Gemini 4 Argon's introductory price doubles on
# 2026-12-01. The window lies partly in the agents' future: the constitution's hard rule 1 forbids
# querying ANY API for times after the cutoff (transcript-audited).
data_cutoff: 2026-11-08
forward_window_days: 10
baselines:
  - {name: synth_default}
hardware: >-
  GCP n1-standard-16: 16 vCPU / 60GB RAM / 1x NVIDIA T4 (16GB VRAM; Turing, no bf16). Your sandbox
  gets 14 CPU, 48GB RAM and the GPU. torch is already in your pyproject — no need to add it
proxy_url: http://localhost:4000
gpu: true
sandbox_memory_gb: 48
sandbox_cpus: 14
poll_seconds: 30
