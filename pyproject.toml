[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synth_bench"]

[project]
name = "synth-bench"
version = "0.1.0"
description = "An autonomous-agent benchmark: coding agents doing quantitative research against a live prediction market"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# The engine lives in synth-lib; this repo holds the campaigns, the results and the leaderboard.
dependencies = [
    "boto3>=1.35",
    "synth-lib[benchmark]",
]

[project.scripts]
synth-bench-leaderboard = "synth_bench.leaderboard:main"

[dependency-groups]
dev = ["pytest>=9.0", "black==26.5.1"]

[tool.uv.sources]
# Pin the engine. The agent workspace no longer carries a rev of its own: the scaffold holds a
# placeholder and create_workspace substitutes whatever commit THIS pin resolved to, so host and
# sandbox run the same library by construction. Setup fails rather than scaffolding a workspace
# when the install has no commit to name — an editable or path install.
synth-lib = { git = "https://github.com/synthdataco/synth-lib", rev = "05780e59dfadbf78169550f985a84d2eede1cb09" }

[tool.black]
line-length = 120
# Champion trees are agent-authored and published verbatim — formatting them would rewrite the
# record a verdict was produced from.
extend-exclude = "campaign_results/"

[tool.pytest.ini_options]
testpaths = ["tests"]
