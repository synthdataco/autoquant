[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synth_bench"]

[project]
name = "synth-bench"
version = "0.1.0"
description = "An autonomous-agent benchmark: coding agents doing quantitative research against a live prediction market"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# The engine lives in synth-lib; this repo holds the campaigns, the results and the leaderboard.
dependencies = [
    "boto3>=1.35",
    "synth-lib[benchmark]",
]

[project.scripts]
synth-bench-leaderboard = "synth_bench.leaderboard:main"

[dependency-groups]
dev = ["pytest>=9.0", "black==26.5.1"]

[tool.uv.sources]
# Pin the engine. The scaffold pins synth-lib too
# (synth_lib/benchmark/scaffold/workspace/pyproject.toml), and the two must resolve the same
# library code: host and sandbox on different backtesters is a silent source of unreproducible
# scores. The scaffold necessarily names the commit BEFORE this one — a commit cannot contain its
# own hash — so the revs differ by exactly the commit that moves the scaffold's own pin, and
# nothing else. Two revs further apart than that is the bug.
synth-lib = { git = "https://github.com/synthdataco/synth-lib", rev = "32c121d44e04a83c59790b90cc09ae1612208934" }

[tool.black]
line-length = 120
# Champion trees are agent-authored and published verbatim — formatting them would rewrite the
# record a verdict was produced from.
extend-exclude = "campaign_results/"

[tool.pytest.ini_options]
testpaths = ["tests"]
